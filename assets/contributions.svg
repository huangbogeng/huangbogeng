<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-label="GitHub open-source contribution metrics">
<style>
.bg{fill:#fff;stroke:#d0d7de}.t{fill:#1f2328;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.m{font:600 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.s{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#57606a}
@media(prefers-color-scheme:dark){.bg{fill:#0d1117;stroke:#30363d}.t{fill:#e6edf3}.s{fill:#8d96a0}}
</style>
<rect x=".5" y=".5" width="899" height="329" rx="8" class="bg"/>
<text x="28" y="40" class="t m">Open-source activity</text>
<text x="28" y="88" class="s">Metrics will populate automatically on the next GitHub Actions run.</text>
</svg>