name: Update contribution metrics

on:
  workflow_dispatch:
  schedule:
    - cron: "15 3 * * *"
  push:
    branches:
      - main
    paths:
      - "scripts/update_contributions.py"
      - ".github/workflows/contributions.yml"

permissions:
  contents: write

concurrency:
  group: profile-contribution-metrics
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate contribution SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: python scripts/update_contributions.py

      - name: Commit updated metrics
        run: |
          if git diff --quiet -- assets/contributions.svg; then
            echo "Contribution metrics are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contributions.svg
          git commit -m "chore: refresh contribution metrics"
          git push
